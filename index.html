<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบเยี่ยมบ้านนักเรียน</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Sarabun',sans-serif;background:#f8f9fa;display:flex;justify-content:center;padding:12px}
.main-card{max-width:600px;width:100%;border-radius:24px;border:none;box-shadow:0 15px 35px rgba(0,0,0,.05)}
.main-card-inner{margin:8px;border:2px dashed #90a4ae;border-radius:18px;padding:24px;background:linear-gradient(135deg,#f0f4f8,#d9e2ec)}
.school-logo{width:110px;height:110px;object-fit:contain}
.custom-btn{width:100%;border:none;border-radius:14px;padding:18px;color:#fff;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;cursor:pointer}
.btn-form{background:linear-gradient(135deg,#1e3c72,#2a5298)}
.btn-summary{background:linear-gradient(135deg,#11998e,#38ef7d)}
.btn-icon-zone{width:42px;height:42px;border-radius:10px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;margin-right:12px}
</style>
</head>
<body>
<div class="main-card">
<div class="main-card-inner text-center">
<img class="school-logo" src="https://drive.google.com/thumbnail?id=1xA8zW4ecizHdCSEpHZ4Oo9jELfq6t-6L&sz=w200">
<h2>ระบบเยี่ยมบ้านนักเรียน</h2>
<h5>โรงเรียนพิชัยวิทยา (บ้านต้นยางมิตรภาพ 14)</h5>
<p>ยินดีต้อนรับเข้าสู่ระบบการบันทึกและติดตามข้อมูลการเยี่ยมบ้านนักเรียน</p>

<div class="custom-btn btn-form" onclick="openLink('https://docs.google.com/forms/d/e/1FAIpQLSf2NETWeeBtwWVPetfElOM7AXzQPChy8viW5cWLPN6s1c9GJQ/viewform?usp=dialog')">
<div style="display:flex;align-items:center">
<div class="btn-icon-zone"><i class="fa-solid fa-file-signature"></i></div>
<div><b>แบบฟอร์มเยี่ยมบ้าน</b><br><small>บันทึกข้อมูลการลงพื้นที่เยี่ยมบ้าน</small></div>
</div>
<i class="fa-solid fa-chevron-right"></i>
</div>

<div class="custom-btn btn-summary" onclick="openLink('https://script.google.com/macros/s/AKfycbwQkKspF0vXgZWDcdpkano5KD1uFiiDFqUVqNvbVl_E9tmMXnTJONLGKdSdJr7VwnpNaQ/exec')">
<div style="display:flex;align-items:center">
<div class="btn-icon-zone"><i class="fa-solid fa-chart-pie"></i></div>
<div><b>สรุปผลการเยี่ยมบ้าน</b><br><small>ดูรายงาน สถิติ และกราฟข้อมูลสรุป</small></div>
</div>
<i class="fa-solid fa-chevron-right"></i>
</div>

<div style="font-size:12px;color:#666">&copy;2026 โรงเรียนพิชัยวิทยา (บ้านต้นยางมิตรภาพ 14) </div>
</div></div>

<script>
function openLink(url){
 try{
   var w=window.open(url,'_blank');
   if(!w){window.location.assign(url);}
 }catch(e){
   window.location.assign(url);
 }
}
</script>
</body>
</html>
